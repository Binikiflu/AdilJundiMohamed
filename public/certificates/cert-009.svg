<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="abokerFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="100%" stop-color="#120905"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" rx="14" fill="url(#abokerFrame)"/>
  <rect x="25" y="25" width="1150" height="800" fill="#fdfbf7" stroke="#d97706" stroke-width="4"/>
  <rect x="40" y="40" width="1120" height="770" fill="none" stroke="#15803d" stroke-width="2"/>

  <!-- Ethiopian & Harari Flags -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="100" height="20" fill="#009a44"/>
    <rect x="0" y="20" width="100" height="20" fill="#fed100"/>
    <rect x="0" y="40" width="100" height="20" fill="#ef2b2d"/>
  </g>
  <g transform="translate(1000, 75)">
    <rect x="0" y="0" width="100" height="30" fill="#ef2b2d"/>
    <rect x="0" y="30" width="100" height="30" fill="#000000"/>
  </g>

  <!-- Harari Crest Header -->
  <g transform="translate(600, 100)">
    <circle cx="0" cy="0" r="38" fill="#1e3a8a"/>
    <circle cx="0" cy="0" r="30" fill="#ffffff"/>
    <path d="M -15,15 L 0,-15 L 15,15 Z" fill="#009a44"/>
  </g>

  <text x="600" y="175" text-anchor="middle" font-family="'Georgia', serif" font-size="38" font-weight="bold" fill="#0f172a">
    Xalayyaa Ragaa / የምስክር ወረቀት
  </text>
  <text x="600" y="210" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a">
    BULCHINSA AANAA ABOKAR / የአቦከር ወረዳ አስተዳደር
  </text>

  <line x1="200" y1="230" x2="1000" y2="230" stroke="#d97706" stroke-width="2"/>

  <text x="600" y="280" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">
    Obboo / Addee: <tspan font-weight="bold" font-size="30" fill="#0f172a">Aadil Jundii / አቶ እዳል ጁንዲ</tspan>
  </text>

  <foreignObject x="140" y="330" width="920" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #1e293b; text-align: center; line-height: 1.8;">
      Xalayaa Ragaa hojii tola Ooltummatin Yeroole adda addaa aana cinaa dhaabbachuun faaynaansi dhaan hojii boonsittuu bu'aa qabdu galmeessisuun fi jijjiirama kana cina dhaabbachuu fakkeenyaaf dhimmə nageenyaa, dhimmaa hooma waraana fi dhimmə koronaa irraatti deeggersa bara 2011-2013 waan godhaa turtaniif xalayaan ragaa kun dhaabbata Keessaniif qophaahe isiniif kennamee jirra.
      <br/>
      <span style="font-size: 15px; color: #475569; font-weight: 500;">
        በተለያዩ ጊዜያት ከ2011-2013 ዓ.ም ድረስ በወረዳችን በሰላም፣ በወታደራዊና በኮቪድ-19 መከላከያ ሥራዎች ላይ በገንዘብና በቁሳቁስ ላደረጉት ከፍተኛ አስተዋጽኦ የተሰጠ የአቦከር ወረዳ የምስክር ወረቀት።
      </span>
    </div>
  </foreignObject>

  <!-- Signatures & Official Seal -->
  <g transform="translate(300, 660)">
    <path d="M -60,20 Q 0,-20 60,15" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="-100" y1="35" x2="100" y2="35" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Sulxan Sani</text>
    <text x="0" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Bulchaa Aanaa Abokar / የአቦከር ወረዳ አስተዳዳሪ</text>
  </g>

  <g transform="translate(850, 650)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a">HARARI PEOPLE STATE</text>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a">ABOKER DISTRICT ADMIN</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#1e3a8a">2011-2013 E.C.</text>
  </g>
</svg>
