<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="goldFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" fill="url(#goldFrameGrad)"/>
  <rect x="30" y="30" width="1140" height="790" fill="#2d1b0e"/>
  <rect x="45" y="45" width="1110" height="760" fill="#fcfbf7" stroke="#b8860b" stroke-width="4"/>

  <!-- Ornate Border Inner -->
  <rect x="60" y="60" width="1080" height="730" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="12,4"/>

  <!-- Commercial Bank of Ethiopia Logo Header -->
  <g transform="translate(560, 80)">
    <!-- CBE Spiral Logo -->
    <path d="M 40,10 C 60,10 75,25 75,45 C 75,65 55,80 35,70 C 20,62 15,40 28,25 C 38,15 55,22 55,38 C 55,48 42,52 35,45" fill="none" stroke="#9a3412" stroke-width="8"/>
    <circle cx="40" cy="42" r="8" fill="#d97706"/>
  </g>

  <text x="600" y="190" text-anchor="middle" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#78350f">
    COMMERCIAL BANK OF ETHIOPIA &amp; COVID-19 RELIEF FUND
  </text>
  <text x="600" y="220" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#92400e">
    የኢትዮጵያ ንግድ ባንክ እና የኮቪድ-19 መከላከያ ግብረ-ኃይል
  </text>

  <!-- Title Badge -->
  <rect x="300" y="250" width="600" height="60" fill="#78350f" rx="8"/>
  <text x="600" y="290" text-anchor="middle" font-family="'Georgia', serif" font-size="26" font-weight="bold" fill="#fef3c7">
    የምስጋናና የክብር አበል ወረቀት ("ከ ወገን ደራሽ ወገን ነው")
  </text>

  <!-- Recipient -->
  <text x="600" y="370" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#451a03">
    የክብር ተበረካች:
  </text>
  <text x="600" y="415" text-anchor="middle" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#030712">
    አዲል ጁንዲ ሞሐመድ / Adil Jundi Mohamed Import Co.
  </text>

  <!-- Donation Amount Highlighting -->
  <rect x="350" y="445" width="500" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="6"/>
  <text x="600" y="478" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="extrabold" fill="#b45309">
    የለገሱት የገንዘብ መጠን: ETB 120,000.00
  </text>

  <!-- Body Text -->
  <foreignObject x="150" y="520" width="900" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 15px; color: #374151; text-align: center; line-height: 1.7;">
      በኮቪድ-19 ወረርሽኝ ወቅት የኅብረተሰቡን ጤና ለማስጠበቅና ድገተኛ ድጋፍ ለማድረስ በኢትዮጵያ ንግድ ባንክ በኩል የ120,000.00 ብር የገንዘብ ድጋፍ በማድረግ ላሳዩት ከፍተኛ ሀገራዊና ወገናዊ ተቆርቋሪነት የተሰጠ የክብር አበል የምስክር ወረቀት።
    </div>
  </foreignObject>

  <!-- Seals and Signatures -->
  <g transform="translate(250, 680)">
    <!-- CBE Blue Seal -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e40af" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e40af">COMMERCIAL BANK</text>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1e40af">OF ETHIOPIA</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#1e40af">2012 E.C. / 2020</text>
  </g>

  <g transform="translate(600, 680)">
    <path d="M -80,-15 Q 0,20 80,-10" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="-120" y1="15" x2="120" y2="15" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">General Manager Adil Jundi Mohamed</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Adil Jundi Mohamed Import Export Ltd.</text>
  </g>

  <g transform="translate(950, 680)">
    <path d="M -60,-10 Q 0,-30 60,10" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="-100" y1="15" x2="100" y2="15" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">CBE &amp; Task Force Chair</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Regional Relief Committee</text>
  </g>
</svg>
