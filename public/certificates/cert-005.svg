<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" fill="url(#goldBorderGrad)"/>
  <rect x="20" y="20" width="1160" height="810" fill="#262626"/>
  <rect x="35" y="35" width="1130" height="780" fill="#fafaf9" stroke="#ca8a04" stroke-width="3"/>

  <!-- Guilloche Pattern Border Simulation -->
  <rect x="50" y="50" width="1100" height="750" fill="none" stroke="#1c1917" stroke-width="2" stroke-dasharray="16,6"/>

  <!-- School Emblem Header -->
  <g transform="translate(600, 110)">
    <circle cx="0" cy="0" r="42" fill="#1e3a8a" stroke="#ca8a04" stroke-width="3"/>
    <!-- Book & Crescent -->
    <path d="M -20,-10 C -10,-20 0,-10 0,10 C 0,-10 10,-20 20,-10 L 20,15 C 10,5 0,15 0,-5 C 0,15 -10,5 -20,15 Z" fill="#ffffff"/>
  </g>

  <text x="600" y="185" text-anchor="middle" font-family="'Georgia', serif" font-size="36" font-weight="bold" fill="#1e3a8a">
    Waraqaa Ragaa / የምስክር ወረቀት
  </text>
  <text x="600" y="215" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350f">
    MADRASAA BILAAL KG FI SAD. 1FFAA / ማድረሳ ቢላል መዋዕለ ህፃናትና አንደኛ ደረጃ ትምህርት ቤት
  </text>

  <line x1="200" y1="235" x2="1000" y2="235" stroke="#ca8a04" stroke-width="2"/>

  <!-- Recipient -->
  <text x="600" y="285" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#44403c">
    Obbo / Addee:
  </text>
  <text x="600" y="335" text-anchor="middle" font-family="'Georgia', serif" font-size="36" font-weight="bold" fill="#0f172a">
    Mahammad Saalah-tiif / ለአቶ መሀመድ ሳላህ
  </text>

  <!-- Body Text -->
  <foreignObject x="140" y="380" width="920" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #292524; text-align: center; line-height: 1.8;">
      Naannoo Hararii, Aanaa Haakim, Araddaa 17 keessatti kan argamu Madrasaa Bilaal KG fi Sad. 1ffaa Ijaarsa Dallaa fi Daree dabalataa ijaaramaa ture keessatti Qabeenya keessaniin hirmaannaa ol'aanaa gochuun tumsa cimaa waan taasiftaniif manni barumsaa kun waraqaa ragaa kana galata guddaa waliin isiniif kennee jira.
      <br/>
      <span style="font-size: 15px; color: #57534e; font-style: italic;">
        በሐረሪ ክልል ሐኪም ወረዳ አራዳ 17 በማድረሳ ቢላል ትምህርት ቤት ቅፅር ግቢ ግንባታና ተጨማሪ ክፍሎች ማሟላት ላይ ላደረጉት የገንዘብና የቁሳቁስ ድጋፍ የተሰጠ ከፍተኛ የምስጋና የምስክር ወረቀት።
      </span>
    </div>
  </foreignObject>

  <!-- Signature & Purple Seal Stamp -->
  <g transform="translate(300, 660)">
    <path d="M -60,20 Q 0,-20 60,15" fill="none" stroke="#1c1917" stroke-width="3"/>
    <line x1="-100" y1="35" x2="100" y2="35" stroke="#78716c" stroke-width="1.5"/>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1c1917">Abdurahman Ahmed Abdule</text>
    <text x="0" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#57534e">ርዕሰ መምህር / Principal</text>
  </g>

  <g transform="translate(850, 650)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#6b21a8" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#6b21a8">MADRASAA BILAAL SCHOOL</text>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#6b21a8">AANAA HAAKIM HARAR</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6b21a8">25-11-2013 E.C.</text>
  </g>
</svg>
