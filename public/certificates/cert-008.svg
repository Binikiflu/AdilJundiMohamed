<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="dbeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" fill="#e7e5e4"/>
  <rect x="20" y="20" width="1160" height="810" fill="url(#dbeGrad)" stroke="#15803d" stroke-width="4"/>

  <!-- Geometric Security Edge Pattern -->
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="10,4"/>

  <!-- DBE Gear Logo Header -->
  <g transform="translate(600, 100)">
    <circle cx="0" cy="0" r="42" fill="#15803d"/>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="extrabold" fill="#ffffff">DBE</text>
  </g>

  <text x="600" y="175" text-anchor="middle" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#0f172a">
    የተሳታፊ ምስክር ወረቀት
  </text>
  <text x="600" y="215" text-anchor="middle" font-family="'Georgia', serif" font-size="32" font-weight="bold" font-style="italic" fill="#15803d">
    Certificate of Participation
  </text>

  <line x1="150" y1="240" x2="1050" y2="240" stroke="#15803d" stroke-width="2"/>

  <!-- Left Amharic / Right English Column -->
  <g transform="translate(100, 270)">
    <!-- Amharic Column -->
    <text x="230" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">ይህ የምስክር ወረቀት ለ</text>
    <text x="230" y="65" text-anchor="middle" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#0f172a">መሐመድ ሳላህ</text>
    <line x1="50" y1="75" x2="410" y2="75" stroke="#0f172a" stroke-width="1.5"/>

    <foreignObject x="20" y="90" width="420" height="250">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 14px; color: #1e293b; text-align: justify; line-height: 1.7;">
        የኢትዮጵያ ልማት ባንክ ከመጋቢት 13 እስከ 17 ቀን 2013 ዓ.ም በስልጠና ማዕከል በቢዝነስ ፕላን ዝግጅትና ራዕይ ቀረጻ፣ ፋይናንስና ሒሳብ አስተዳደር፣ ንግድ ሥራ አመራር፣ ገበያ ፈልጎ፣ ሰው ኃይል አስተዳደር እና በፖሊሲ ኢንቨስትመንት ላይ የተዘጋጀውን ስልጠና በብቃት ላጠናቀቁ የተሰጠ።
      </div>
    </foreignObject>
  </g>

  <!-- Divider Line -->
  <line x1="600" y1="260" x2="600" y2="600" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4"/>

  <g transform="translate(650, 270)">
    <!-- English Column -->
    <text x="230" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">This certificate of participation is awarded to</text>
    <text x="230" y="65" text-anchor="middle" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#0f172a">MOHAMMED SALAH</text>
    <line x1="50" y1="75" x2="410" y2="75" stroke="#0f172a" stroke-width="1.5"/>

    <foreignObject x="20" y="90" width="420" height="250">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 14px; color: #1e293b; text-align: justify; line-height: 1.7;">
        who has successfully completed the training program on <strong>Business Plan Preparation and Vision Setting, Financial Statement Preparation, Business Management, Marketing, Human Resource Management and Policy Environment</strong> organized by Development Bank of Ethiopia for Small and Medium Enterprises starting from 20-26 March 2021.
      </div>
    </foreignObject>
  </g>

  <!-- DBE President Signature & Stamp -->
  <g transform="translate(600, 680)">
    <path d="M -80,-10 C -40,-30 40,10 80,-20" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="-150" y1="10" x2="150" y2="10" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">PRESIDENT, DEVELOPMENT BANK OF ETHIOPIA</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#15803d">የኢትዮጵያ ልማት ባንክ ፕሬዚዳንት</text>
  </g>
</svg>
