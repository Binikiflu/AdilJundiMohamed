<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="qeladambaFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1e10"/>
      <stop offset="100%" stop-color="#140904"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" rx="12" fill="url(#qeladambaFrame)"/>
  <rect x="25" y="25" width="1150" height="800" fill="#fefdfa" stroke="#ca8a04" stroke-width="5"/>
  <rect x="42" y="42" width="1116" height="766" fill="none" stroke="#1c1917" stroke-width="1.5"/>

  <!-- Develop Qeladamba Header Logo -->
  <g transform="translate(600, 100)">
    <rect x="-80" y="-30" width="160" height="40" fill="#2d3748" rx="4"/>
    <text x="0" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Develop Qeladamba</text>
    <text x="0" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c1917">የቀለዓምባ ልማት ማህበር</text>
  </g>

  <text x="600" y="195" text-anchor="middle" font-family="'Georgia', serif" font-size="40" font-weight="bold" fill="#0f172a">
    የምስጋና ምስክር ወረቀት
  </text>

  <line x1="250" y1="225" x2="950" y2="225" stroke="#ca8a04" stroke-width="2"/>

  <text x="600" y="275" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#44403c">
    ለአቶ: <tspan font-weight="bold" font-size="34" fill="#0f172a">መሀመድ ሳላ / Mr. Mohamed Salah</tspan>
  </text>

  <foreignObject x="140" y="325" width="920" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #1c1917; text-align: center; line-height: 1.8;">
      የቀለዓምባ ልማት ማህበር በአቦከር ወረዳ ለሚገኙ ምንም ዓይነት የገቢ ምንጭም ሆነ መደገፊያ ለሌላቸው አረጋውያን፣ ህመምተኞች እና ወጣቶች ለሚያደርጋቸው የተለያዩ ድጋፎች እርስዎ ማህበሩ ከተቋቋመ ጊዜ ጀምሮ የፈረሱ ቤቶችን በመጠገን፣ ለወጣቶችና ህፃናት የትምህርት መረጃ ቁሳቁሶችን በማሟላት፣ አመት በዓል በመጣ ቁጥር አስፈላጊ የሆኑ በሬ፣ ዘይት፣ ዶሮ፣ እንቁላል እና የተለያዩ ቁሳቁሶችን በመለገስ ከእናት፣ ከአባት፣ ከልጅም በላይ የቅርብ ሰው በመሆን የላቀ አስተዋፅኦ በማድረግዎ ከታላቅ አክብሮትና ትህትና ጋር ይህንን ምስክር ወረቀት ተሰጥቷል።
    </div>
  </foreignObject>

  <!-- Signatures & Date Stamp -->
  <g transform="translate(300, 670)">
    <path d="M -60,20 C -20,-10 20,30 60,0" fill="none" stroke="#1c1917" stroke-width="3"/>
    <line x1="-100" y1="35" x2="100" y2="35" stroke="#78716c" stroke-width="1.5"/>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1c1917">ፊርማ / Signature</text>
  </g>

  <g transform="translate(850, 660)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#4c1d95" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#4c1d95">DEVELOP QELADAMBA</text>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#4c1d95">ASSOCIATION</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4c1d95">28/04/2013 ዓ.ም</text>
  </g>
</svg>
