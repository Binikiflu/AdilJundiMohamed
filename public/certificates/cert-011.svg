<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="goldSwash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="url(#goldSwash)" stroke-width="6"/>

  <!-- Swash Ornaments in Corners -->
  <path d="M 30,120 Q 30,30 120,30 C 80,60 60,80 30,120 Z" fill="#b45309"/>
  <path d="M 1170,120 Q 1170,30 1080,30 C 1120,60 1140,80 1170,120 Z" fill="#b45309"/>
  <path d="M 30,730 Q 30,820 120,820 C 80,790 60,770 30,730 Z" fill="#b45309"/>
  <path d="M 1170,730 Q 1170,820 1080,820 C 1120,790 1140,770 1170,730 Z" fill="#b45309"/>

  <text x="600" y="160" text-anchor="middle" font-family="'Georgia', serif" font-size="42" font-weight="bold" fill="#0f172a">
    WARAQAA RAGAA / የምስክር ወረቀት
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309">
    KANTIIBA BUL/MAGAALAA HARAMAAYAA / የሐረማያ ከተማ አስተዳደር ከንቲባ
  </text>

  <line x1="200" y1="220" x2="1000" y2="220" stroke="#d97706" stroke-width="2"/>

  <text x="600" y="275" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">
    Obboo / Addee: <tspan font-weight="bold" font-size="34" fill="#0f172a">Mahmad Saala / አቶ መሀመድ ሳላ</tspan>
  </text>

  <foreignObject x="140" y="325" width="920" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #1e293b; text-align: justify; line-height: 1.8;">
      Waraqaan Ragaa Kun Kan Isiniif Kennameef Isiin Gootoota Keenya, Leencoota Koo, Jaallewwaan Qaalii! Guddaa Galatoomaa! Jaallewaan Keenya nu ammananni aarsaa Kafalani haara lubbun isaani ni boqootti! Imaanaa Jaallewwan Keenya mikeessun Injiffanno sabaa keenya ittii fuffiisistani jirtu. Isiin faana Qabsa'uun ulfiina, Kabaja, carraa guddaa dha Jireenya Koo Kes-satti argadhe.
      <br/><br/>
      <span style="font-size: 15px; color: #334155;">
        ይህ የምስክር ወረቀት የተሰጠዎት ጊዜያትን እና ህይወትን መስዋዕት በማድረግ በደጋፊነት በመሆን ላበረከቱት አስተዋጽኦ ታላቅ አክብሮት እያመሰገንን የላቀ ድጋፍ እያደረጉ ላበረከቱት አስተዋጽኦ የተሰጠ የምስክር ወረቀት።
      </span>
    </div>
  </foreignObject>

  <!-- Mayor Signature & Blue Seal -->
  <g transform="translate(300, 670)">
    <path d="M -60,20 Q 0,-20 60,15" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="-100" y1="35" x2="100" y2="35" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Kantiiba Bul/Magaalaa Haramaayaa</text>
    <text x="0" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Haramaya Town Mayor</text>
  </g>

  <g transform="translate(850, 660)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8">HARAMAYA TOWN</text>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1d4ed8">ADMINISTRATION</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">2013 E.C. / 2021</text>
  </g>
</svg>
