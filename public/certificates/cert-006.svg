<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#140b06"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="850" rx="12" fill="url(#darkWood)"/>
  <rect x="25" y="25" width="1150" height="800" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="5"/>
  <rect x="42" y="42" width="1116" height="766" fill="none" stroke="#15803d" stroke-width="2"/>

  <!-- Electric Utility Emblem -->
  <g transform="translate(600, 105)">
    <circle cx="0" cy="0" r="42" fill="#15803d"/>
    <circle cx="0" cy="0" r="34" fill="#ffffff"/>
    <path d="M -15,-20 L 5,-5 L -5,5 L 15,20 L -5,5 L 5,-5 Z" fill="#d97706" stroke="#b45309" stroke-width="2"/>
  </g>

  <text x="600" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#15803d">
    የሐረሪ ክልል ኤሌክትሪክ አገልግሎት / HARARI REGION ELECTRIC UTILITY
  </text>
  <text x="600" y="230" text-anchor="middle" font-family="'Georgia', serif" font-size="38" font-weight="bold" fill="#0f172a">
    የዕውቅናና የምስክር ወረቀት
  </text>

  <line x1="250" y1="255" x2="950" y2="255" stroke="#d97706" stroke-width="2"/>

  <text x="600" y="305" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">
    ለ አቶ / Mr.:
  </text>
  <text x="600" y="355" text-anchor="middle" font-family="'Georgia', serif" font-size="36" font-weight="bold" fill="#0f172a">
    መሐመድ ሳላ / Mohamed Salah
  </text>

  <foreignObject x="150" y="405" width="900" height="190">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', sans-serif; font-size: 17px; color: #1e293b; text-align: center; line-height: 1.8;">
      የሐረሪ ክልል ኤሌክትሪክ አገልግሎት በክልሉ ለህበረተሰቡ የሚሰጠውን አገልግሎት ፈጣን፣ ቀልጣፋና አስተማማኝ ለማድረግ በተደረገው ጥረትና የተጠበቀ የሥራ ግንኙነት በማድረግ የሐረሪ ሪጅን ይህንን የምስክር ወረቀት አበርክቷል።
      <br/>
      <span style="font-size: 15px; color: #475569; font-weight: 500;">
        For strategic partnership, dedicated technical cooperation, and equipment supply enhancing regional electricity grid stability and public utility service across Harari Regional State.
      </span>
    </div>
  </foreignObject>

  <!-- Seal & Signature -->
  <g transform="translate(300, 660)">
    <path d="M -60,25 C -20,0 20,40 60,10" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="-100" y1="40" x2="100" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">የኤሌክትሪክ አገልግሎት ሥራ አስፈፃሚ</text>
    <text x="0" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">Harari Region Utility Executive</text>
  </g>

  <g transform="translate(850, 650)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#15803d" stroke-width="3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#15803d">HARARI REGION</text>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#15803d">ELECTRIC UTILITY</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#15803d">2013 E.C. / 2021</text>
  </g>
</svg>
